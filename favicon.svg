<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Modern Therapeutic Kinetic Spiral / Manual Healing Flow -->
  <g filter="url(#glow)">
    <!-- Flowing Wave 1 (Upper Arc) -->
    <path d="M16 36 C 20 20, 32 18, 46 22 C 50 23, 48 27, 44 26 C 34 23, 25 25, 22 38 C 21 42, 15 40, 16 36 Z" fill="url(#waveGrad1)"/>
    
    <!-- Flowing Wave 2 (Lower Alignment Arc) -->
    <path d="M48 28 C 44 44, 32 46, 18 42 C 14 41, 16 37, 20 38 C 30 41, 39 39, 42 26 C 43 22, 49 24, 48 28 Z" fill="url(#waveGrad2)"/>
    
    <!-- Core Equilibrium Node (Therapeutic Focus Center) -->
    <circle cx="32" cy="32" r="4.5" fill="#38bdf8"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
  </g>
</svg>